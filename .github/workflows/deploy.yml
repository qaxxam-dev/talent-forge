name: Deploy TalentForge to Oracle Cloud

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '**.md'
      - '.gitignore'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy & Restart on Oracle Cloud Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo -u deployer git -C /home/deployer/talent-forge pull origin main
            sudo -u deployer bash -c 'cd /home/deployer/talent-forge/backend && uv sync'
            sudo -u deployer bash -c 'cd /home/deployer/talent-forge/frontend && npm install --production=false && npm run build'
            sudo systemctl restart talentforge-backend
            sudo systemctl restart talentforge-frontend

